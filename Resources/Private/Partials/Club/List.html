<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="tx-clubdirectory-list">
    <f:for each="{clubs}" as="club">
        <div class="d-flex mb-3">
            <f:if condition="{club.logo.0}">
                <f:image image="{club.logo.0}"
                         class="flex-shrink-0 me-3"
                         alt="{club.title}"
                         width="{settings.list.image.width}"
                         height="{settings.list.image.height}"
                         minWidth="{settings.list.image.minWidth}"
                         maxWidth="{settings.list.image.maxWidth}"
                         minHeight="{settings.list.image.minHeight}"
                         maxHeight="{settings.list.image.maxHeight}"
                />
            </f:if>
            <div class="flex-grow-1">
                <h5 class="mt-0">
                    <f:link.action
                        action="show"
                        controller="Club"
                        pluginName="Clubdirectory"
                        extensionName="Clubdirectory"
                        title="{club.title}"
                        pageUid="{settings.pidOfDetailPage}"
                        arguments="{club: club}"
                    >{club.title}
                    </f:link.action>
                </h5>
                <f:if condition="{club.activity}">
                    {club.activity}
                </f:if>
            </div>
        </div>
    </f:for>
    <f:render partial="Component/Pagination"
              arguments="{pagination: pagination, paginator: paginator, actionName: actionName}"/>
</div>
</html>
