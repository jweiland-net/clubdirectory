<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:checkfaluploads="http://typo3.org/ns/JWeiland/Checkfaluploads/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Only rendered if EXT:checkfaluploads is loaded. The value is read by the
    CheckFalUploadValidator (see CheckFalUploadsEventListener) from "club.{property}.rights".
</f:comment>
<div class="form-group form-check">
    <f:form.checkbox property="{property}.rights"
                     id="{property}Rights"
                     class="form-check-input"
                     value="1"/>
    <label class="form-check-label" for="{property}Rights">
        <checkfaluploads:imageRightsMessage/>
    </label>
</div>
</html>
