<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:security.ifAuthenticated>
    <div>
        <p>
            <f:link.action class="new"
                           action="new"
                           controller="Management"
                           pluginName="Management"
                           pageUid="{settings.pidOfManagementPage}"
                           title="{f:translate(key: 'newEntry')}">
                <span>{f:translate(key: "newEntry")}</span>
            </f:link.action>
        </p>
        <p>
            <f:link.action class="listMyClubs"
                           action="listMyClubs"
                           controller="Management"
                           pluginName="Management"
                           pageUid="{settings.pidOfManagementPage}"
                           title="{f:translate(key: 'listMyClubs')}">
                <span>{f:translate(key: "listMyClubs")}</span>
            </f:link.action>
        </p>
    </div>
</f:security.ifAuthenticated>
</html>
