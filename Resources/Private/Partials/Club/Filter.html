<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:form action="listSearchResults"
        controller="Search"
        pluginName="Search"
        pageUid="{settings.pidOfSearchResults}">
    <f:if condition="{settings.category} == 0">
        <div class="mb-3">
            <label for="clubdirectory-filter-category" class="form-label">{f:translate(key: "filterByCategory")}:</label>
            <f:form.select class="form-select"
                           id="clubdirectory-filter-category"
                           name="search[category]"
                           value="{search.category}"
                           options="{categories}"
                           optionLabelField="title"
                           optionValueField="uid"
                           prependOptionLabel=""
                           prependOptionValue="0"
                           sortByOptionLabel="1"
                           additionalAttributes="{onChange: 'this.form.submit()'}"/>
        </div>
    </f:if>

    <f:if condition="{settings.district} == 0">
        <div class="mb-3">
            <label for="clubdirectory-filter-district" class="form-label">{f:translate(key: "filterByDistrict")}:</label>
            <f:form.select class="form-select"
                           id="clubdirectory-filter-district"
                           name="search[district]"
                           value="{search.district}"
                           options="{districts}"
                           optionLabelField="district"
                           optionValueField="uid"
                           prependOptionLabel=""
                           prependOptionValue="0"
                           sortByOptionLabel="1"
                           additionalAttributes="{onChange: 'this.form.submit()'}"/>
        </div>
    </f:if>

    <div class="mb-3">
        <label for="clubdirectory-filter-order" class="form-label">{f:translate(key: "sortDirection")}:</label>
        <f:form.select class="form-select"
                       id="clubdirectory-filter-order"
                       name="search[order]"
                       value="{search.order}"
                       options="{search.sortingOrders}"
                       optionLabelField="value"
                       optionValueField="key"
                       prependOptionLabel=""
                       prependOptionValue="0"
                       sortByOptionLabel="1"
                       additionalAttributes="{onChange: 'this.form.submit()'}"/>
    </div>
</f:form>
</html>
