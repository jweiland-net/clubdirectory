<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:form action="listSearchResults"
        controller="Search"
        pluginName="Search"
        pageUid="{settings.pidOfSearchResults}"
        name="search"
        class="row g-2 align-items-center mb-3">
    <div class="col-auto">
        <f:form.textfield name="search[searchWord]"
                          class="form-control"
                          value="{search.searchWord}"
                          aria-label="{f:translate(key: 'search')}"/>
    </div>
    <div class="col-auto">
        <f:form.submit class="btn btn-secondary" value="{f:translate(key: 'search')}"/>
    </div>
</f:form>
</html>
