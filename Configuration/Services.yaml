services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  JWeiland\Clubdirectory\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Called by makeInstance in our FrontendUser domain model
  JWeiland\Clubdirectory\Domain\Repository\FrontendUserRepository:
    public: true

  # Called by makeInstance in our ClubController
  JWeiland\Clubdirectory\Helper\HiddenObjectHelper:
    public: true

  # Called by container->get in FormRequestHandler of EXT:form
  JWeiland\Clubdirectory\Domain\Factory\ArrayFormFactory:
    public: true

  # Called by makeInstance in FormDefinition of EXT:form. The finisher is used
  # in several steps of a form, so each step needs its own instance.
  JWeiland\Clubdirectory\Domain\Finisher\SaveClubFinisher:
    public: true
    shared: false

  # Called by makeInstance in ValidatorResolver of Extbase
  JWeiland\Clubdirectory\Domain\Validator\GeocodingFailureValidator:
    public: true
    shared: false

  # Called by makeInstance from the hooks of EXT:form
  JWeiland\Clubdirectory\Hook\Form\GeocodeAddressesHook:
    public: true
  JWeiland\Clubdirectory\Hook\Form\PrefillForEditUsageHook:
    public: true
  JWeiland\Clubdirectory\Hook\Form\PrefillOptionsHook:
    public: true
  JWeiland\Clubdirectory\Hook\Form\RichTextEditorHook:
    public: true

  JWeiland\Clubdirectory\EventListener\SetTitleOfPOIToClubTitleEventListener:
    tags:
    - name: event.listener
      event: JWeiland\Maps2\Event\PostProcessPoiCollectionRecordEvent

  JWeiland\Clubdirectory\EventListener\AddPaginatorEventListener:
    tags:
    - name: event.listener
      event: JWeiland\Clubdirectory\Event\PostProcessFluidVariablesEvent
  JWeiland\Clubdirectory\EventListener\AddGlossaryEventListener:
    tags:
    - name: event.listener
      event: JWeiland\Clubdirectory\Event\PostProcessFluidVariablesEvent
      after: JWeiland\Clubdirectory\EventListener\AddPaginatorEventListener
